version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: parking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: parking_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: parking_backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/parking_db?schema=public"
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: